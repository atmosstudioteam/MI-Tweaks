name: Build

on:
  workflow_dispatch:

  push:
    branches:
      - 1.21.1

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MOD_VERSION: 1.9.4-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build MI Tweaks Forked
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MI-Tweaks-Forked-build
          path: build/libs/*.jar
